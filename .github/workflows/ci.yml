name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install official MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Record compiler and format development sources
        run: |
          moon version --all
          moon fmt
      - name: Check, build and test portable packages
        run: |
          for target in js wasm wasm-gc native; do
            moon check --target "$target" --deny-warn
            moon build --target "$target" --deny-warn
            moon test --target "$target" --deny-warn
          done
      - name: Export API and package source
        run: |
          moon info
          moon package
      - name: Save formatted source and compiled JS for Windows inspection
        if: always()
        run: |
          mkdir -p _build/audit
          git diff --binary > _build/audit/formatted.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-artifacts
          path: |
            _build/audit/formatted.patch
            _build/js/debug/build/
            _build/publish/
